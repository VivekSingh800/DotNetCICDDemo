
name: .NET 9 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore StudentInfoDemo.sln

      - name: Build application
        run: dotnet build StudentInfoDemo.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test StudentInfoDemo.sln --configuration Release --no-build